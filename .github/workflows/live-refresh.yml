name: Refresh v4b live marks

on:
  schedule:
    # Weekdays after the US close (21:15 UTC in winter, 20:15 in summer).
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4b-live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements.txt

      - run: pip install -r live/requirements.txt

      - name: Mark the frozen book to market
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python live/refresh.py --no-intraday

      - name: Commit the snapshot
        run: |
          git config user.name "quarcc-live-bot"
          git config user.email "bot@quarcc.com"
          git add public/portfolios src/content/portfolios/quarcc-v4b.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh v4b live marks"
          git push
